<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d"><title id="t">SFP: Skills for Productivity</title><desc id="d">SFP keeps 1,065 skills on a shelf. For the task &quot;make the login not get hacked&quot; it lights up the few that fit and hands them to your AI: web-app-penetration-testing.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
