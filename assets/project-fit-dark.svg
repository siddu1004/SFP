<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-labelledby="t d"><title id="t">Same words across five projects</title><desc id="d">For &quot;write tests for the orders&quot;, SFP chooses: Next.js: react-testing, playwright-cli; Rust: rust-testing; .NET: csharp-testing; Flutter: dart-flutter-patterns, flutter-dart-code-review; Django: django-celery, django-tdd.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="396" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">Same words, five projects</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">Real output, no model. Keyword search gives all five the same list; SFP reads the project first.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="186" width="210" height="84" rx="12" fill="#18202b" stroke="#2dd4bf" stroke-width="2"/><text x="58" y="216" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="start">You ask</text><text x="58" y="240" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">&quot;write tests for</text><text x="58" y="258" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono"> the orders&quot;</text></g><g class="rise" style="animation-delay:0.35s"><rect x="300" y="176" width="156" height="104" rx="14" fill="#18202b" stroke="#2dd4bf" stroke-width="2"/><text x="378" y="220" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle">SFP</text><text x="378" y="246" font-size="13" font-weight="500" fill="#9aa4b0" text-anchor="middle">reads the project</text></g><path class="draw" pathLength="1" d="M250 228 H294" fill="none" stroke="#2dd4bf" stroke-width="2" style="animation-delay:0.50s"/><path class="fade" d="M300 228 l-8 -4 v8 z" fill="#2dd4bf" style="animation-delay:0.90s"/><circle class="pulse" r="4" fill="#2dd4bf" opacity="0"><animateMotion path="M250 228 H294" dur="1.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle><path class="draw" pathLength="1" d="M456 228 C500 228 500 122 544 122" fill="none" stroke="#2dd4bf" stroke-width="2" style="animation-delay:0.65s"/><path class="fade" d="M550 122 l-8 -4 v8 z" fi