<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">SFP Hive Multi-Bundle Stacking Engine</title>
  <desc id="d">Stack multiple bundles concurrently without limits, automatically ordered and deduplicated into active agent roles.</desc>
  <defs>
    <linearGradient id="b-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="b-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="b-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="card-shadow-m" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="16" fill="#12171f"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="15.5" fill="none" stroke="#2c3643" stroke-width="1"/>

  <!-- Header -->
  <text x="64" y="48" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="-0.02em">Dynamic Multi-Bundle Stacking: Unlimited Combinations</text>
  <text x="64" y="74" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#9aa4b0">Attach multiple workflow bundles simultaneously. Hive deduplicates skills and orders them by role in real time.</text>

  <!-- BUNDLE 1: Frontend Polish -->
  <g transform="translate(64, 105)">
    <rect width="320" height="150" rx="10" fill="#18202b" stroke="#06b6d4" stroke-width="1" filter="url(#card-shadow-m)"/>
    <text x="20" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22d3ee">Bundle A: Frontend Polish</text>
    <text x="20" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9aa4b0">UX review, animation, and responsive craft</text>
    <g transform="translate(20, 66)">
      <rect width="280" height="24" rx="4" fill="url(#b-cyan)"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#e6edf3">1. impeccable</text>
    </g>
    <g transform="translate(20, 94)">
      <rect width="280" height="24" rx="4" fill="url(#b-cyan)"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#e6edf3">2. design-taste-frontend</text>
    </g>
    <g transform="translate(20, 122)">
      <rect width="280" height="24" rx="4" fill="url(#b-cyan)"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#e6edf3">3. animate</text>
    </g>
  </g>

  <!-- BUNDLE 2: Bug Fix Pipeline -->
  <g transform="translate(64, 275)">
    <rect width="320" height="125" rx="10" fill="#18202b" stroke="#a855f7" stroke-width="1" filter="url(#card-shadow-m)"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#c084fc">Bundle B: Fix A Bug Properly</text>
    <text x="20" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9aa4b0">Root-cause diagnosis and regression proof</text>
    <g transform="translate(20, 62)">
      <rect width="280" height="24" rx="4" fill="url(#b-purple)"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#e6edf3">1. investigate-first</text>
    </g>
    <g transform="translate(20, 90)">
      <rect width="280" height="24" rx="4" fill="url(#b-purple)"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#e6edf3">2. surgical-patch</text>
    </g>
  </g>

  <!-- CONVERGENCE CONDUITS -->
  <path d="M 384 180 C 470 180, 480 230, 560 230" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M 384 335 C 470 335, 480 260, 560 260" stroke="#a855f7" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- MIDDLE: HIVE STACKING ENGINE -->
  <g transform="translate(560, 140)">
    <rect width="260" height="210" rx="12" fill="#1b2533" stroke="#2dd4bf" stroke-width="1.5" filter="url(#card-shadow-m)"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">Hive Stacking Engine</text>
    
    <g transform="translate(16, 52)">
      <rect width="228" height="38" rx="6" fill="#202e3f"/>
      <text x="12" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Deduplication Layer</text>
    </g>
    <g transform="translate(16, 98)">
      <rect width="228" height="38" rx="6" fill="#202e3f"/>
      <text x="12" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Role Allocation (Plan-Base-Check)</text>
    </g>
    <g transform="translate(16, 144)">
      <rect width="228" height="48" rx="6" fill="#134e4a"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#5eead4">No Hard Limit on Bundles</text>
      <text x="12" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a7f3d0">Stack 2, 4, or 10 bundles</text>
    </g>
  </g>

  <!-- ARROW TO ACTIVE OUTPUT -->
  <path d="M 820 245 L 870 245" stroke="#2dd4bf" stroke-width="2.5"/>
  <polygon points="870,240 880,245 870,250" fill="#2dd4bf"/>

  <!-- OUTPUT: UNIFIED AGENT CONTEXT -->
  <g transform="translate(880, 105)">
    <rect width="336" height="295" rx="12" fill="#18202b" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow-m)"/>
    <text x="24" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Unified Agent Memory</text>
    <text x="24" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9aa4b0">Injected via .agents/rules/sfp-active-skills.md</text>

    <!-- Ordered Execution Stack -->
    <g transform="translate(20, 68)">
      <rect width="296" height="34" rx="6" fill="#142c26" stroke="#10b981" stroke-width="0.75"/>
      <text x="12" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a7f3d0">1. investigate-first</text>
      <text x="236" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6ee7b7">plan</text>
    </g>
    <g transform="translate(20, 108)">
      <rect width="296" height="34" rx="6" fill="#142c26" stroke="#10b981" stroke-width="0.75"/>
      <text x="12" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a7f3d0">2. impeccable</text>
      <text x="236" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6ee7b7">base</text>
    </g>
    <g transform="translate(20, 148)">
      <rect width="296" height="34" rx="6" fill="#142c26" stroke="#10b981" stroke-width="0.75"/>
      <text x="12" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a7f3d0">3. design-taste-frontend</text>
      <text x="236" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6ee7b7">style</text>
    </g>
    <g transform="translate(20, 188)">
      <rect width="296" height="34" rx="6" fill="#142c26" stroke="#10b981" stroke-width="0.75"/>
      <text x="12" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a7f3d0">4. surgical-patch</text>
      <text x="236" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6ee7b7">fix</text>
    </g>
    <g transform="translate(20, 228)">
      <rect width="296" height="34" rx="6" fill="#142c26" stroke="#10b981" stroke-width="0.75"/>
      <text x="12" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a7f3d0">5. animate</text>
      <text x="236" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6ee7b7">polish</text>
    </g>
    <text x="24" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">Both bundles active simultaneously</text>
  </g>
</svg>
