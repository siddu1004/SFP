<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="374" viewBox="0 0 1000 374" role="img" aria-labelledby="t d"><title id="t">What it costs your AI</title><desc id="d">Every skill switched on is 81,690 tokens. SFP picks average 6,117 tokens, 7,333 with the map: 91% less.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="374" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">What it costs your AI</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">91% less text to hold than every skill switched on. Token counts are estimates (4 characters each).</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="450" height="246" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Tokens held (lower is better)</text><text x="60" y="158" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">average over the benchmark tasks; 41% of a 200k window if all are on</text></g><text x="60" y="204" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.30s">Every skill on</text><rect x="186" y="188" width="180" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="186" y="188" width="180.0" height="22" rx="5" fill="#fb7185" style="animation-delay:0.50s"/><text x="376" y="204" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono fade" style="animation-delay:0.90s">81,690</text><text x="60" y="256" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.40s">SFP picks</text><rect x="186" y="240" width="180" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="186" y="240" width="13.5" height="22" rx="5" fill="#2dd4bf" style="animation-delay:0.65s"/><text x="376" y="256" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono fade" style="animation-delay:1.00s">6,117</text><text x="60" y="308" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.50s">SFP picks + map</text><rect x="186" y="292" width="180" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="186" y="292" width="16.2" height="22" rx="5" fill="#a78bfa" style="animation-delay:0.80s"/><text x="376" y="308" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono fade" style="animation-delay:1.10s">7,333</text><g class="rise" style="animation-delay:0.25s"><rect x="510" y="106" width="450" height="246" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><text x="530" y="138" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Time to pick</text><text x="530" y="158" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">one laptop, models already loaded; typical and slowest 5%</text></g><text x="530" y="190" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.35s">SFP, no model</text><rect x="530" y="196" width="200" height="20" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="530" y="196" width="7.8" height="20" rx="5" fill="#38bdf8" fill-opacity=".4" style="animation-delay:0.50s"/><rect class="grow" x="530" y="196" width="4.0" height="20" rx="5" fill="#38bdf8" style="animation-delay:0.70s"/><text x="740" y="211" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono fade" style="animation-delay:1.00s">7 ms, slowest 20 ms</text><text x="530" y="260" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.45s">SFP + bge-m3</text><rect x="530" y="266" width="200" height="20" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="530" y="266" width="200.0" height="20" rx="5" fill="#2dd4bf" fill-opacity=".4" style="animation-delay:0.50s"/><rect class="grow" x="530" y="266" width="161.9" height="20" rx="5" fill="#2dd4bf" style="animation-delay:0.70s"/><text x="740" y="281" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono fade" style="animation-delay:1.00s">413 ms, slowest 510 ms</text></svg>