<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">SFP Hive vs Traditional Agent Tooling</title>
  <desc id="d">Flow comparison showing traditional static skill dumping versus SFP Hive dynamic contextual orchestration.</desc>
  <defs>
    <filter id="card-shadow-l" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="16" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="15.5" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <text x="64" y="48" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Why Choose SFP Hive: The Architecture Advantage</text>
  <text x="64" y="74" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b">Stop burning 30% of your context window before the first prompt. Hive selects the exact 3-4 skills needed in sub-3ms.</text>

  <!-- TOP PATH: TRADITIONAL -->
  <g transform="translate(64, 100)">
    <rect width="1152" height="120" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1" filter="url(#card-shadow-l)"/>
    <rect width="6" height="120" rx="3" fill="#dc2626"/>
    <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="0.06em">TRADITIONAL AGENT SETUP (STATIC INJECTION)</text>

    <!-- Step 1 -->
    <g transform="translate(24, 42)">
      <rect width="240" height="60" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Dump All 800+ Skills</text>
      <text x="14" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#dc2626">58,000 token overhead</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 276 72 L 316 72" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="316,68 324,72 316,76" fill="#dc2626"/>

    <!-- Step 2 -->
    <g transform="translate(328, 42)">
      <rect width="240" height="60" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Blind Keyword Search</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">9% accuracy on new tasks</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 580 72 L 620 72" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="620,68 628,72 620,76" fill="#dc2626"/>

    <!-- Step 3 -->
    <g transform="translate(632, 42)">
      <rect width="240" height="60" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Conflicting Instructions</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Agent hallucinates &amp; stalls</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 884 72 L 924 72" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="924,68 932,72 924,76" fill="#dc2626"/>

    <!-- Step 4 Outcome -->
    <g transform="translate(936, 42)">
      <rect width="192" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Slow Convergence</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#991b1b">3.7 review rounds</text>
    </g>
  </g>

  <!-- BOTTOM PATH: SFP HIVE -->
  <g transform="translate(64, 240)">
    <rect width="1152" height="150" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" filter="url(#card-shadow-l)"/>
    <rect width="6" height="150" rx="3" fill="#059669"/>
    <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.06em">THE SFP HIVE ADVANTAGE (COLLECTIVE INTELLIGENCE + RL)</text>

    <!-- Step 1 -->
    <g transform="translate(24, 46)">
      <rect width="240" height="84" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">5-Signal Quorum</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Words, Files, Phase, Cat, Hist</text>
      <text x="14" y="64" font-family="ui-monospace, monospace" font-size="10" fill="#059669">Sub-3ms Local Fingerprint</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 276 88 L 316 88" stroke="#059669" stroke-width="2"/>
    <polygon points="316,84 324,88 316,92" fill="#059669"/>

    <!-- Step 2 -->
    <g transform="translate(328, 46)">
      <rect width="240" height="84" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">LinUCB Bandit &amp; Bundles</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Explores &amp; stacks any bundles</text>
      <text x="14" y="64" font-family="ui-monospace, monospace" font-size="10" fill="#059669">Unlimited Multi-Bundle Support</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 580 88 L 620 88" stroke="#059669" stroke-width="2"/>
    <polygon points="620,84 628,88 620,92" fill="#059669"/>

    <!-- Step 3 -->
    <g transform="translate(632, 46)">
      <rect width="240" height="84" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="0.75"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">Targeted Context Delivery</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Exact role order: plan-base-check</text>
      <text x="14" y="64" font-family="ui-monospace, monospace" font-size="10" fill="#059669">266 tokens (218x leaner)</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 884 88 L 924 88" stroke="#059669" stroke-width="2"/>
    <polygon points="924,84 932,88 924,92" fill="#059669"/>

    <!-- Step 4 Outcome -->
    <g transform="translate(936, 46)">
      <rect width="192" height="84" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
      <text x="14" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">Ready in 1 Round Less</text>
      <text x="14" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065f46">2.8 review rounds</text>
      <text x="14" y="64" font-family="ui-monospace, monospace" font-size="10" fill="#059669">86% selection accuracy</text>
    </g>
  </g>
</svg>
