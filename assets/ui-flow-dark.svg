<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="t d"><title id="t">UI, design systems and motion workflows</title><desc id="d">Two ordered UI and frontend bundles: Accessible UI &amp; Forms Bundle (frontend-a11y -&gt; ux-writing -&gt; react-patterns -&gt; accessibility-audit) and Visual Taste &amp; Motion Studio (design-taste-frontend -&gt; impeccable -&gt; animate -&gt; break-ui).</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="355" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">UI, design systems and motion workflows</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">Ordered frontend bundles guide your AI from semantic markup and typography scale to hardware-accelerated motion.</text><text x="40" y="116" font-size="13" font-weight="700" fill="#fb7185" text-anchor="start" class="fade" style="animation-delay:0.15s">Accessible UI &amp; Forms Bundle</text><g class="rise" style="animation-delay:0.20s"><rect x="40" y="126" width="212" height="58" rx="12" fill="#18202b" stroke="#fb7185" stroke-width="2"/><circle cx="62" cy="155" r="11" fill="#fb7185"/><text x="62" y="159" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">1</text><text x="80" y="150" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">frontend-a11y</text><text x="80" y="168" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">semantic HTML &amp; ARIA</text></g><path class="draw" pathLength="1" d="M252 155 H276" fill="none" stroke="#fb7185" stroke-width="2" style="animation-delay:0.60s"/><path class="fade" d="M282 155 l-8 -4 v8 z" fill="#fb7185" style="animation-delay:1.10s"/><circle class="pulse" r="4" fill="#fb7185" opacity="0"><animateMotion path="M252 155 H276" dur="1.8s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.8s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.32s"><rect x="282" y="126" width="212" height="58" rx="12" fill="#18202b" stroke="#fb7185" stroke-width="2"/><circle cx="304" cy="155" r="11" fill="#fb7185"/><text x="304" y="159" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">2</text><text x="322" y="150" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">ux-writing</text><text x="322" y="168" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">concise microcopy</text></g><path class="draw" pathLength="1" d="M494 155 H518" fill="none" stroke="#fb7185" stroke-width="2" style="animation-delay:0.75s"/><path class="fade" d="M524 155 l-8 -4 v8 z" fill="#fb7185" style="animation-delay:1.25s"/><circle class="pulse" r="4" fill="#fb7185" opacity="0"><animateMotion path="M494 155 H518" dur="1.8s" begin="2.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.15s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.44s"><rect x="524" y="126" width="212" height="58" rx="12" fill="#18202b" stroke="#fb7185" stroke-width="2"/><circle cx="546" cy="155" r="11" fill="#fb7185"/><text x="546" y="159" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">3</text><text x="564" y="150" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">react-patterns</text><text x="564" y="168" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">state &amp; composition</text></g><path class="draw" pathLength="1" d="M736 155 H760" fill="none" stroke="#fb7185" stroke-width="2" style="animation-delay:0.90s"/><path class="fade" d="M766 155 l-8 -4 v8 z" fill="#fb7185" style="animation-delay:1.40s"/><circle class="pulse" r="4" fill="#fb7185" opacity="0"><animateMotion path="M736 155 H760" dur="1.8s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.5s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.56s"><rect x="766" y="126" width="212" height="58" rx="12" fill="#18202b" stroke="#fb7185" stroke-width="2"/><circle cx="788" cy="155" r="11" fill="#fb7185"/><text x="788" y="159" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">4</text><text x="806" y="150" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">accessibility-audit</text><text x="806" y="168" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">WCAG &amp; keyboard check</text></g><text x="40" y="231" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" class="fade" style="animation-delay:0.35s">Visual Taste &amp; Motion Studio</text><g class="rise" style="animation-delay:0.40s"><rect x="40" y="241" width="212" height="58" rx="12" fill="#18202b" stroke="#a78bfa" stroke-width="2"/><circle cx="62" cy="270" r="11" fill="#a78bfa"/><text x="62" y="274" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">1</text><text x="80" y="265" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">design-taste-front..</text><text x="80" y="283" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">hierarchy &amp; spacing</text></g><path class="draw" pathLength="1" d="M252 270 H276" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-delay:0.80s"/><path class="fade" d="M282 270 l-8 -4 v8 z" fill="#a78bfa" style="animation-delay:1.30s"/><circle class="pulse" r="4" fill="#a78bfa" opacity="0"><animateMotion path="M252 270 H276" dur="1.8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.2s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.52s"><rect x="282" y="241" width="212" height="58" rx="12" fill="#18202b" stroke="#a78bfa" stroke-width="2"/><circle cx="304" cy="270" r="11" fill="#a78bfa"/><text x="304" y="274" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">2</text><text x="322" y="265" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">impeccable</text><text x="322" y="283" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">editorial polish</text></g><path class="draw" pathLength="1" d="M494 270 H518" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-delay:0.95s"/><path class="fade" d="M524 270 l-8 -4 v8 z" fill="#a78bfa" style="animation-delay:1.45s"/><circle class="pulse" r="4" fill="#a78bfa" opacity="0"><animateMotion path="M494 270 H518" dur="1.8s" begin="2.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.55s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.64s"><rect x="524" y="241" width="212" height="58" rx="12" fill="#18202b" stroke="#a78bfa" stroke-width="2"/><circle cx="546" cy="270" r="11" fill="#a78bfa"/><text x="546" y="274" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">3</text><text x="564" y="265" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">animate</text><text x="564" y="283" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">spring &amp; CSS motion</text></g><path class="draw" pathLength="1" d="M736 270 H760" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-delay:1.10s"/><path class="fade" d="M766 270 l-8 -4 v8 z" fill="#a78bfa" style="animation-delay:1.60s"/><circle class="pulse" r="4" fill="#a78bfa" opacity="0"><animateMotion path="M736 270 H760" dur="1.8s" begin="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.9s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.76s"><rect x="766" y="241" width="212" height="58" rx="12" fill="#18202b" stroke="#a78bfa" stroke-width="2"/><circle cx="788" cy="270" r="11" fill="#a78bfa"/><text x="788" y="274" font-size="11" font-weight="700" fill="#12171f" text-anchor="middle">4</text><text x="806" y="265" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="mono">break-ui</text><text x="806" y="283" font-size="1