<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Install SFP in three steps</title><desc id="d">Install SFP in three steps on Windows, macOS or Linux: run npx sfp-hive install, restart your AI tool, then ask it to use sfp-hive for a task.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="320" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">Three steps</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Windows, macOS and Linux. You need Node.js 18+ and Python 3.8+.</text><g class="rise" style="animation-delay:0.20s"><rect x="40" y="110" width="290" height="140" rx="14" fill="#fbf9f4" stroke="#0f766e" stroke-width="2"/><circle cx="74" cy="144" r="16" fill="#0f766e"/><text x="74" y="150" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="102" y="150" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">Install</text><rect x="58" y="172" width="254" height="30" rx="7" fill="#1a1d21"/><text x="70" y="192" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start" class="mono">npx sfp-hive install</text><text x="60" y="230" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">finds your AI tools and adds a starter set</text></g><path class="draw" pathLength="1" d="M332 180 H353" stroke="#0f766e" stroke-width="2" style="animation-delay:0.60s"/><g class="rise" style="animation-delay:0.40s"><rect x="355" y="110" width="290" height="140" rx="14" fill="#fbf9f4" stroke="#6d28d9" stroke-width="2"/><circle cx="389" cy="144" r="16" fill="#6d28d9"/><text x="389" y="150" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="417" y="150" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">Restart</text><rect x="373" y="172" width="254" height="30" rx="7" fill="#1a1d21"/><text x="385" y="192" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start" class="mono">close and reopen it</text><text x="375" y="230" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">so it loads the new skills</text></g><path class="draw" pathLength="1" d="M647 180 H668" stroke="#0f766e" stroke-width="2" style="animation-delay:0.80s"/><g class="rise" style="animation-delay:0.60s"><rect x="670" y="110" width="290" height="140" rx="14" fill="#fbf9f4" stroke="#b45309" stroke-width="2"/><circle cx="704" cy="144" r="16" fill="#b45309"/><text x="704" y="150" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="732" y="150" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">Ask</text><rect x="688" y="172" width="254" height="30" rx="7" fill="#1a1d21"/><text x="700" y="192" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="start" class="mono">Use sfp-hive for this task: …</text><text x="690" y="230" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">it names its skills, then follows them</text></g><g class="pop" style="animation-delay:1.00s"><rect x="40" y="270" width="108" height="30" rx="15" fill="none" stroke="#e2ddd2" stroke-width="1.5"/><text x="94" y="290" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="middle">Windows</text></g><g class="pop" style="animation-delay:1.10s"><rect x="158" y="270" width="108" height="30" rx="15" fill="none" stroke="#e2ddd2" stroke-width="1.5"/><text x="212" y="290" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="middle">macOS</text></g><g class="pop" style="animation-delay:1.20s"><rect x="276" y="270" width="108" height="30" rx="15" fill="none" stroke="#e2ddd2" stroke-width="1.5"/><text x="330" y="290" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="middle">Linux</text></g><text x="400" y="290" font-size="13" font-weight="400" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:1.30s">Claude Code users can add the plugin instead: /plugin marketplace add siddu1004/SFP</text></svg>