ay:0.75s">code, text</text><text x="60" y="378" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.80s">Needs</text><text x="124" y="378" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start" class="mono fade" style="animation-delay:0.80s">nothing</text><text x="60" y="400" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.85s">Next to</text><text x="124" y="400" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start" class="mono fade" style="animation-delay:0.85s">frontend-patterns, react-patterns</text><g class="rise" style="animation-delay:0.25s"><rect x="410" y="106" width="550" height="316" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><text x="430" y="138" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="start">A task raises towers</text><text x="430" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">&quot;make the login not get hacked&quot;</text></g><g class="rise" style="animation-delay:0.50s"><polygon points="443.0,336 476,352.5 476,204.5 443.0,188" fill="#18202b"/><polygon points="443.0,336 476,352.5 476,204.5 443.0,188" fill="#2dd4bf" fill-opacity="0.78"/><polygon points="509.0,336 476,352.5 476,204.5 509.0,188" fill="#18202b"/><polygon points="509.0,336 476,352.5 476,204.5 509.0,188" fill="#2dd4bf" fill-opacity="0.55"/><polygon points="443.0,188 476,204.5 509.0,188 476,171.5" fill="#18202b"/><polygon points="443.0,188 476,204.5 509.0,188 476,171.5" fill="#2dd4bf" fill-opacity="1.0"/><path d="M443.0 319.6 L476 336.1 L509.0 319.6" fill="none" stroke="#18202b" stroke-width="1.5" stroke-opacity=".8"/><path d="M443.0 303.1 L476 319.6 L509.0 303.1" fill="none" stroke="#18202b" stroke-width="1.5" stroke-opacity=".8"/><path d="M443.0 286.7 L476 303.2 L509.0 286.7" fill="none" stroke="#18202b" stroke-width="1.5" stroke-opacity=".8"/><path d="M443.0 270.2 L476 286.7 L509.0 270.