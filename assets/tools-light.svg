><g class="pop" style="animation-delay:0.40s"><rect x="627.12" y="112" width="150" height="36" rx="18" fill="#fbf9f4" stroke="#4d7c0f" stroke-width="1.5"/><circle cx="645.12" cy="130" r="4" fill="#4d7c0f"/><text x="657.12" y="135" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">GitHub Copilot</text></g><g class="pop" style="animation-delay:0.44s"><rect x="786.88" y="112" width="95" height="36" rx="18" fill="#fbf9f4" stroke="#0f766e" stroke-width="1.5"/><circle cx="804.88" cy="130" r="4" fill="#0f766e"/><text x="816.88" y="135" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">VS Code</text></g><g class="pop" style="animation-delay:0.48s"><rect x="40" y="160" width="103" height="36" rx="18" fill="#fbf9f4" stroke="#6d28d9" stroke-width="1.5"/><circle cx="58" cy="178" r="4" fill="#6d28d9"/><text x="70" y="183" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">Windsurf</text></g><g class="pop" style="animation-delay:0.52s"><rect x="152.72" y="160" width="71" height="36" rx="18" fill="#fbf9f4" stroke="#b45309" stroke-width="1.5"/><circle cx="170.72" cy="178" r="4" fill="#b45309"/><text x="182.72" y="183" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">Kiro</text></g><g class="pop" style="animation-delay:0.56s"><rect x="234.07999999999998" y="160" width="103" height="36" rx="18" fill="#fbf9f4" stroke="#be123c" stroke-width="1.5"/><circle cx="252.07999999999998" cy="178" r="4" fill="#be123c"/><text x="264.08" y="183" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">OpenCode</text></g><g class="pop" style="animation-delay:0.60s"><rect x="346.79999999999995" y="160" width="79" height="36" rx="18" fill="#fbf9f4" stroke="#0369a1" stroke-width="1.5"/><circle cx="364.79999999999995" cy="178" r="4" fill="#0369a1"/><text x="376.79999999999995" y="183" font-size="14" font-weight="600" fill="#1a1d21" text-anchor="start">Cline</text></g><g class="pop" style="animation-delay:0.64s"><rect x="