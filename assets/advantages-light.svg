<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="t d"><title id="t">Why SFP: The Unfair Advantages</title><desc id="d">Six unfair advantages of SFP: 96% less context, manifest stack fit, 0.0% junk rate, adaptive taste, 100% local and private execution, and 20 AI tools synced.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="444" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">Why teams switch to SFP</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Eliminates context bloat (loading 50+ rules) and context starvation (guessing conventions).</text><g class="rise" style="animation-delay:0.18s"><rect x="40.0" y="108" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M54.0 109 H321.0" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.45s"/><rect x="58.0" y="128" width="178" height="24" rx="12" fill="#0f766e" fill-opacity="0.16"/><text x="68.0" y="144" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start" class="mono">3,383 vs 81,691 tokens</text><text x="58.0" y="178" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">96% Less Context</text><text x="58.0" y="206" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Loads only the 1 to 3 skills needed right now,</text><text x="58.0" y="226" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">leaving 98% of your 200k window free for code.</text></g><g class="rise" style="animation-delay:0.28s"><rect x="352.5" y="108" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M366.5 109 H633.5" stroke="#0369a1" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.55s"/><rect x="370.5" y="128" width="150" height="24" rx="12" fill="#0369a1" fill-opacity="0.16"/><text x="380.5" y="144" font-size="12" font-weight="700" fill="#0369a1" text-anchor="start" class="mono">0 wrong-tech picks</text><text x="370.5" y="178" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">Manifest Stack Fit</text><text x="370.5" y="206" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Inspects package.json, Cargo.toml and go.mod</text><text x="370.5" y="226" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">so Go never gets Django rules and Rust stays Rust.</text></g><g class="rise" style="animation-delay:0.38s"><rect x="665.0" y="108" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M679.0 109 H946.0" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.65s"/><rect x="683.0" y="128" width="193" height="24" rx="12" fill="#6d28d9" fill-opacity="0.16"/><text x="693.0" y="144" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="start" class="mono">Strict confidence gating</text><text x="683.0" y="178" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">0.0% Junk Rate</text><text x="683.0" y="206" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Micro-edits and negative edge tasks return clean</text><text x="683.0" y="226" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">empty stacks instead of 62% keyword noise.</text></g><g class="rise" style="animation-delay:0.48s"><rect x="40.0" y="274" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M54.0 275 H321.0" stroke="#be123c" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.75s"/><rect x="58.0" y="294" width="164" height="24" rx="12" fill="#be123c" fill-opacity="0.16"/><text x="68.0" y="310" font-size="12" font-weight="700" fill="#be123c" text-anchor="start" class="mono">100% format override</text><text x="58.0" y="344" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">Adaptive Taste</text><text x="58.0" y="372" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Learns whether you prefer code, prose, motion</text><text x="58.0" y="392" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">or video over a 30-day feedback half-life.</text></g><g class="rise" style="animation-delay:0.58s"><rect x="352.5" y="274" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M366.5 275 H633.5" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.85s"/><rect x="370.5" y="294" width="171" height="24" rx="12" fill="#b45309" fill-opacity="0.16"/><text x="380.5" y="310" font-size="12" font-weight="700" fill="#b45309" text-anchor="start" class="mono">~3 ms words-only pick</text><text x="370.5" y="344" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">100% Local &amp; Private</text><text x="370.5" y="372" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Runs in stdlib Python on your machine. Optional</text><text x="370.5" y="392" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Ollama / LM Studio models keep prompts local.</text></g><g class="rise" style="animation-delay:0.68s"><rect x="665.0" y="274" width="295" height="148" rx="14" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><path class="draw" pathLength="1" d="M679.0 275 H946.0" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.95s"/><rect x="683.0" y="294" width="186" height="24" rx="12" fill="#4d7c0f" fill-opacity="0.16"/><text x="693.0" y="310" font-size="12" font-weight="700" fill="#4d7c0f" text-anchor="start" class="mono">1,065 skills everywhere</text><text x="683.0" y="344" font-size="18" font-weight="700" fill="#1a1d21" text-anchor="start">20 AI Tools Synced</text><text x="683.0" y="372" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Claude Code, Cursor, Antigravity, Copilot, Codex,</text><text x="683.0" y="392" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">Windsurf and any MCP client share one brain.</text></g></svg>