<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-labelledby="t d"><title id="t">How SFP learns and grows skills</title><desc id="d">First pick in the preferred format, before and after learning: Visual Learner (Animation) 40% to 80%; Deep Reader (Text / Prose) 50% to 60%; Hands-on Engineer (Code / Patterns) 90% to 90%; Video &amp; Demo Producer (Video / Screencasts) 100% to 100%. A research skill is made by following your topics, reading new papers, drafting with a local model, and your approval.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="424" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">It learns from you, and grows missing skills</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Your feedback and history stay on your machine. A research skill is a draft until you approve it.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="450" height="296" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">First pick in the format you like</text><text x="60" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">4 simulated learners, 10 new tasks each, no model</text><rect x="60" y="172" width="12" height="10" rx="3" fill="#a8a190"/><text x="78" y="181" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Before</text><rect x="140" y="172" width="12" height="10" rx="3" fill="#0f766e"/><text x="158" y="181" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start">After it has learned</text></g><text x="60" y="218" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.30s">Visual Learner</text><rect class="grow" x="212" y="202" width="76.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.45s"/><rect class="grow" x="212" y="215" width="152.0" height="12" rx="3" fill="#6d28d9" style="animation-delay:0.65s"/><text x="372.0" y="222" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:0.95s">40% to 80%</text><text x="60" y="264" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.40s">Deep Reader</text><rect class="grow" x="212" y="248" width="95.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.55s"/><rect class="grow" x="212" y="261" width="114.0" height="12" rx="3" fill="#0369a1" style="animation-delay:0.75s"/><text x="334.0" y="268" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.05s">50% to 60%</text><text x="60" y="310" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.50s">Hands-on Engineer</text><rect class="grow" x="212" y="294" width="171.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.65s"/><rect class="grow" x="212" y="307" width="171.0" height="12" rx="3" fill="#0f766e" style="animation-delay:0.85s"/><text x="391.0" y="314" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.15s">90% to 90%</text><text x="60" y="356" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.60s">Video &amp; Demo Producer</text><rect class="grow" x="212" y="340" width="190.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.75s"/><rect class="grow" x="212" y="353" width="190.0" height="12" rx="3" fill="#b45309" style="animation-delay:0.95s"/><text x="410.0" y="360" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.25s">100% to 100%</text><g class="rise" style="animation-delay:0.25s"><rect x="510" y="106" width="450" height="296" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="530" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">A skill from new research</text><text x="530" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">sfp research auto on: looks every few days</text></g><g class="rise" style="animation-delay:0.40s"><rect x="530" y="178" width="410" height="42" rx="8" fill="#f4f1ea" stroke="#be123c" stroke-width="1.5"/><text x="546" y="196" font-size="13" font-weight="700" fill="#be123c" text-anchor="start" class="mono">1. Follow</text><text x="546" y="212" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">your topics, the fastest growing first</text></g><path class="draw" pathLength="1" d="M735 220 V232" stroke="#be123c" stroke-width="2" fill="none" style="animation-delay:0.70s"/><circle class="pulse" r="4" fill="#be123c" opacity="0"><animateMotion path="M735 220 V232" dur="1.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.55s"><rect x="530" y="232" width="410" height="42" rx="8" fill="#f4f1ea" stroke="#0369a1" stroke-width="1.5"/><text x="546" y="250" font-size="13" font-weight="700" fill="#0369a1" text-anchor="start" class="mono">2. Read</text><text x="546" y="266" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">new papers from arXiv and two other indexes</text></g><path class="draw" pathLength="1" d="M735 274 V286" stroke="#0369a1" stroke-width="2" fill="none" style="animation-delay:0.85s"/><circle class="pulse" r="4" fill="#0369a1" opacity="0"><animateMotion path="M735 274 V286" dur="1.6s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.7s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.70s"><rect x="530" y="286" width="410" height="42" rx="8" fill="#f4f1ea" stroke="#6d28d9" stroke-width="1.5"/><text x="546" y="304" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start" class="mono">3. Draft</text><text x="546" y="320" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">a local model writes a cited SKILL.md</text></g><path class="draw" pathLength="1" d="M735 328 V340" stroke="#6d28d9" stroke-width="2" fill="none" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#6d28d9" opacity="0"><animateMotion path="M735 328 V340" dur="1.6s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="2.0s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.85s"><rect x="530" y="340" width="410" height="42" rx="8" fill="#f4f1ea" stroke="#0f766e" stroke-width="1.5"/><text x="546" y="358" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" class="mono">4. You approve</text><text x="546" y="374" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">then SFP can pick it for your tasks</text></g></svg>