<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-labelledby="t d"><title id="t">How SFP learns your taste and grows skills</title><desc id="d">SFP learns which format helps you across animation, reading, code and video, respecting explicit format overrides 100% of the time, while the research mentor turns academic papers into draft skills for your approval.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="424" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">It learns your taste and grows missing skills</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Tracks format preferences with a 30-day half-life, and drafts new skills from peer-reviewed papers.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="450" height="296" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">1. Format Adaptation by Learner Persona</text><text x="60" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">First pick matches preferred format (40 unseen tasks)</text><rect x="60" y="172" width="12" height="10" rx="3" fill="#a8a190"/><text x="78" y="181" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Cold start</text><rect x="164" y="172" width="12" height="10" rx="3" fill="#0f766e"/><text x="182" y="181" font-size="12" font-weight="600" fill="#1a1d21" text-anchor="start">After learning taste</text></g><text x="60" y="216" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.30s">Visual (Animation)</text><rect class="grow" x="205" y="200" width="84.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.45s"/><rect class="grow" x="205" y="213" width="168.0" height="12" rx="3" fill="#6d28d9" style="animation-delay:0.65s"/><text x="381.0" y="223" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:0.95s">40% -&gt; 80%</text><text x="60" y="258" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.40s">Reader (Deep Text)</text><rect class="grow" x="205" y="242" width="147.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.55s"/><rect class="grow" x="205" y="255" width="210.0" height="12" rx="3" fill="#0369a1" style="animation-delay:0.75s"/><text x="423.0" y="265" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.05s">70% -&gt; 100%</text><text x="60" y="300" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.50s">Hands-on (Code)</text><rect class="grow" x="205" y="284" width="168.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.65s"/><rect class="grow" x="205" y="297" width="210.0" height="12" rx="3" fill="#0f766e" style="animation-delay:0.85s"/><text x="423.0" y="307" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.15s">80% -&gt; 100%</text><text x="60" y="342" font-size="13" font-weight="600" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.60s">Producer (Video)</text><rect class="grow" x="205" y="326" width="189.0" height="10" rx="3" fill="#a8a190" style="animation-delay:0.75s"/><rect class="grow" x="205" y="339" width="210.0" height="12" rx="3" fill="#b45309" style="animation-delay:0.95s"/><text x="423.0" y="349" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.25s">90% -&gt; 100%</text><g class="rise" style="animation-delay:1.10s"><rect x="60" y="366" width="410" height="24" rx="6" fill="#0f766e" fill-opacity="0.16"/><text x="265" y="382" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">100% strict compliance when prompt names a format (&quot;as text&quot;)</text></g><g class="rise" style="animation-delay:0.25s"><rect x="510" y="106" width="450" height="296" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="530" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">2. Autonomous Research Mentor</text><text x="530" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Fills library gaps from OpenAlex, arXiv &amp; Semantic Scholar</text></g><g class="rise" style="animation-delay:0.40s"><rect x="530" y="178" width="410" height="40" rx="8" fill="#f4f1ea" stroke="#be123c" stroke-width="1.5"/><text x="546" y="196" font-size="13" font-weight="700" fill="#be123c" text-anchor="start" class="mono">1. Detect Gap</text><text x="546" y="211" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">sfp mentor spots thin stack coverage</text></g><path class="draw" pathLength="1" d="M735 218 V230" stroke="#be123c" stroke-width="2" fill="none" style="animation-delay:0.70s"/><circle class="pulse" r="4" fill="#be123c" opacity="0"><animateMotion path="M735 218 V230" dur="1.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.55s"><rect x="530" y="230" width="410" height="40" rx="8" fill="#f4f1ea" stroke="#0369a1" stroke-width="1.5"/><text x="546" y="248" font-size="13" font-weight="700" fill="#0369a1" text-anchor="start" class="mono">2. Fetch Papers</text><text x="546" y="263" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Well-cited works from OpenAlex &amp; arXiv</text></g><path class="draw" pathLength="1" d="M735 270 V282" stroke="#0369a1" stroke-width="2" fill="none" style="animation-delay:0.85s"/><circle class="pulse" r="4" fill="#0369a1" opacity="0"><animateMotion path="M735 270 V282" dur="1.6s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1.7s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.70s"><rect x="530" y="282" width="410" height="40" rx="8" fill="#f4f1ea" stroke="#6d28d9" stroke-width="1.5"/><text x="546" y="300" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start" class="mono">3. Draft Skill</text><text x="546" y="315" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Local model distills methods into SKILL.md</text></g><path class="draw" pathLength="1" d="M735 322 V334" stroke="#6d28d9" stroke-width="2" fill="none" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#6d28d9" opacity="0"><animateMotion path="M735 322 V334" dur="1.6s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="2.0s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.85s"><rect x="530" y="334" width="410" height="40" rx="8" fill="#f4f1ea" stroke="#0f766e" stroke-width="1.5"/><text x="546" y="352" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" class="mono">4. You Approve</text><text x="546" y="367" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">sfp research approve &lt;name&gt; installs it</text></g></svg>