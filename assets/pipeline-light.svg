<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="t d"><title id="t">How SFP picks</title><desc id="d">Your task and project go to three signals: words, meaning and project fit. Rank fusion joins them into one shortlist, an optional local model orders it, and you get one to three skills plus fitting bundles. Your feedback flows back into the choice.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="410" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">How SFP picks</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Everything runs on your machine. Dashed steps are optional and need a local model.</text><g class="rise" style="animation-delay:0.20s"><rect x="40" y="163.0" width="150" height="74" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="2"/><rect x="40" y="177.0" width="4" height="46" rx="2" fill="#e2ddd2"/><text x="56" y="189.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Your task</text><text x="56" y="209.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">what you asked,</text><text x="56" y="226.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">and your project</text></g><g class="rise" style="animation-delay:0.32s"><rect x="250" y="103.0" width="170" height="74" rx="12" fill="#fbf9f4" stroke="#0369a1" stroke-width="2"/><rect x="250" y="117.0" width="4" height="46" rx="2" fill="#0369a1"/><text x="266" y="129.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Words</text><text x="266" y="149.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">matching words in</text><text x="266" y="166.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">names and examples</text></g><g class="rise" style="animation-delay:0.44s"><rect x="250" y="193.0" width="170" height="74" rx="12" fill="#fbf9f4" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/><rect x="250" y="207.0" width="4" height="46" rx="2" fill="#6d28d9"/><text x="266" y="219.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Meaning</text><text x="266" y="239.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">a local embedding</text><text x="266" y="256.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">model (bge-m3)</text></g><g class="rise" style="animation-delay:0.56s"><rect x="250" y="283.0" width="170" height="74" rx="12" fill="#fbf9f4" stroke="#b45309" stroke-width="2"/><rect x="250" y="297.0" width="4" height="46" rx="2" fill="#b45309"/><text x="266" y="309.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Project fit</text><text x="266" y="329.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">drops skills for</text><text x="266" y="346.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">other technologies</text></g><g class="rise" style="animation-delay:0.68s"><rect x="480" y="193.0" width="150" height="74" rx="12" fill="#fbf9f4" stroke="#0f766e" stroke-width="2"/><rect x="480" y="207.0" width="4" height="46" rx="2" fill="#0f766e"/><text x="496" y="219.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Fuse</text><text x="496" y="239.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">rank fusion,</text><text x="496" y="256.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">one shortlist</text></g><g class="rise" style="animation-delay:0.80s"><rect x="670" y="193.0" width="150" height="74" rx="12" fill="#fbf9f4" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/><rect x="670" y="207.0" width="4" height="46" rx="2" fill="#be123c"/><text x="686" y="219.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Local judge</text><text x="686" y="239.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">a chat model</text><text x="686" y="256.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">orders the list</text></g><g class="rise" style="animation-delay:0.92s"><rect x="860" y="193.0" width="110" height="74" rx="12" fill="#fbf9f4" stroke="#0f766e" stroke-width="2"/><rect x="860" y="207.0" width="4" height="46" rx="2" fill="#0f766e"/><text x="876" y="219.0" font-size="16" font-weight="700" fill="#1a1d21" text-anchor="start">Your stack</text><text x="876" y="239.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">1 to 3 skills,</text><text x="876" y="256.0" font-size="13" font-weight="400" fill="#565c64" text-anchor="start">plus bundles</text></g><path class="draw" pathLength="1" d="M190 200 C220.0 200 220.0 140 244 140" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.00s"/><path class="fade" d="M250 140 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:1.80s"/><path class="draw" pathLength="1" d="M190 200 C220.0 200 220.0 230 244 230" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.18s"/><path class="fade" d="M250 230 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:1.98s"/><path class="draw" pathLength="1" d="M190 200 C220.0 200 220.0 320 244 320" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.36s"/><path class="fade" d="M250 320 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:2.16s"/><path class="draw" pathLength="1" d="M420 140 C450.0 140 450.0 230 474 230" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.54s"/><path class="fade" d="M480 230 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:2.34s"/><path class="draw" pathLength="1" d="M420 230 C450.0 230 450.0 230 474 230" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.72s"/><path class="fade" d="M480 230 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:2.52s"/><path class="draw" pathLength="1" d="M420 320 C450.0 320 450.0 230 474 230" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" style="animation-delay:1.90s"/><path class="fade" d="M480 230 l-9 -5 v10 z" fill="#0f766e" style="animation-delay:2.70s"/><path class="draw" pathLength="1