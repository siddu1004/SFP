<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="446" viewBox="0 0 1000 446" role="img" aria-labelledby="t d"><title id="t">How SFP picks</title><desc id="d">Your task goes to five readers: words, full text, requests, meaning and your project. Each draws a map of heights over the skills. A learned selector adds the maps and returns one to three skills, a map of the next forty your AI can choose from, or nothing when no skill fits. Your feedback moves its weights.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="446" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">How SFP picks</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">Each reader draws a map of the city. The tallest buildings over all the maps win. Dashed needs a local model.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="214" width="140" height="74" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="2"/><text x="58" y="246" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start">Your task</text><text x="58" y="268" font-size="13" font-weight="400" fill="#9aa4b0" text-anchor="start">in your words</text></g><g class="rise" style="animation-delay:0.25s"><rect x="250" y="106" width="236" height="50" rx="10" fill="#18202b" stroke="#38bdf8" stroke-width="2"/><text x="266" y="137" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Words</text></g><rect class="rise" x="394" y="138.8" width="11" height="10.2" rx="2" fill="#38bdf8" style="animation-delay:0.50s"/><rect class="rise" x="409" y="121.8" width="11" height="27.2" rx="2" fill="#38bdf8" style="animation-delay:0.54s"/><rect class="rise" x="424" y="142.2" width="11" height="6.8" rx="2" fill="#38bdf8" style="animation-delay:0.58s"/><rect class="rise" x="439" y="132.0" width="11" height="17.0" rx="2" fill="#38bdf8" style="animation-delay:0.62s"/><rect class="rise" x="454" y="145.6" width="11" height="3.4" rx="2" fill="#38bdf8" style="animation-delay:0.66s"/><path class="draw" pathLength="1" d="M180 251 C215 251 215 131 244 131" fill="none" stroke="#38bdf8" stroke-width="1.8" style="animation-delay:0.50s"/><path class="draw" pathLength="1" d="M486 131 C530 131 530 251 574 251" fill="none" stroke="#38bdf8" stroke-width="1.8" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#38bdf8" opacity="0"><animateMotion 