<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-labelledby="t d"><title id="t">Understanding plain words with local models</title><desc id="d">Adding a local embedding model (bge-m3) and chat judge raises accuracy on paraphrased tasks from 57% to 83% (and 97% on the 150-task final exam), mapping beginner prompts directly to specialist skills.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="404" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">When you describe the problem in plain words</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">Add a free local embedding model (bge-m3) and chat judge to understand intent, not just keywords.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="440" height="276" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">Paraphrased Tasks (Zero Shared Keywords)</text><text x="60" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Right skill chosen when phrasing is reworded</text></g><text x="60" y="199" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.30s">Keyword search</text><rect x="200" y="184" width="175" height="20" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="184" width="99.8" height="20" rx="5" fill="#a8a190" style="animation-delay:0.50s"/><text x="385" y="199" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.90s">57%</text><text x="60" y="245" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.40s">SFP words only</text><rect x="200" y="230" width="175" height="20" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="230" width="99.8" height="20" rx="5" fill="#0369a1" style="animation-delay:0.64s"/><text x="385" y="245" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:1.00s">57% (0% junk)</text><text x="60" y="291" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.50s">+ Meaning (bge-m3)</text><rect x="200" y="276" width="175" height="20" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="276" width="134.8" height="20" rx="5" fill="#6d28d9" style="animation-delay:0.78s"/><text x="385" y="291" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:1.10s">77% (+20 pts)</text><text x="60" y="337" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.60s">+ Local model judge</text><rect x="200" y="322" width="175" height="20" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="322" width="145.2" height="20" rx="5" fill="#0f766e" style="animation-delay:0.92s"/><text x="385" y="337" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:1.20s">83% (97% on final exam)</text><g class="rise" style="animation-delay:0.25s"><rect x="500" y="106" width="460" height="276" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="520" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">How Plain English Maps to Specialist Skills</text><text x="520" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">bge-m3 cosine similarity + local chat model rerank</text></g><g class="rise" style="animation-delay:0.45s"><rect x="520" y="180" width="228" height="30" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="530" y="199" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">&quot;make the login not get hacked&quot;</text><rect x="782" y="180" width="158" height="30" rx="7" fill="#0f766e" fill-opacity="0.16" stroke="#0f766e" stroke-width="1.5"/><text x="861" y="199" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle" class="mono">security-review</text></g><path class="draw" pathLength="1" d="M748 195 H776" stroke="#0f766e" stroke-width="2" fill="none" style="animation-delay:0.70s"/><path class="fade" d="M780 195 l-6 -4 v8 z" fill="#0f766e" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#0f766e" opacity="0"><animateMotion path="M748 195 H776" dur="1.8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.59s"><rect x="520" y="226" width="228" height="30" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="530" y="245" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">&quot;test all the buttons on my site&quot;</text><rect x="782" y="226" width="158" height="30" rx="7" fill="#6d28d9" fill-opacity="0.16" stroke="#6d28d9" stroke-width="1.5"/><text x="861" y="245" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle" class="mono">playwright-cli</text></g><path class="draw" pathLength="1" d="M748 241 H776" stroke="#6d28d9" stroke-width="2" fill="none" style="animation-delay:0.84s"/><path class="fade" d="M780 241 l-6 -4 v8 z" fill="#6d28d9" style="animation-delay:1.14s"/><circle class="pulse" r="4" fill="#6d28d9" opacity="0"><animateMotion path="M748 241 H776" dur="1.8s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.8s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.73s"><rect x="520" y="272" width="228" height="30" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="530" y="291" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">&quot;sneaky memory leaks in goroutines&quot;</text><rect x="782" y="272" width="158" height="30" rx="7" fill="#b45309" fill-opacity="0.16" stroke="#b45309" stroke-width="1.5"/><text x="861" y="291" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle" class="mono">golang-patterns</text></g><path class="draw" pathLength="1" d="M748 287 H776" stroke="#b45309" stroke-width="2" fill="none" style="animation-delay:0.98s"/><path class="fade" d="M780 287 l-6 -4 v8 z" fill="#b45309" style="animation-delay:1.28s"/><circle class="pulse" r="4" fill="#b45309" opacity="0"><animateMotion path="M748 287 H776" dur="1.8s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.1s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.87s"><rect x="520" y="318" width="228" height="30" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="530" y="337" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">&quot;explain attention visually&quot;</text><rect x="782" y="318" width="158" height="30" rx="7" fill="#be123c" fill-opacity="0.16" stroke="#be123c" stroke-width="1.5"/><text x="861" y="337" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle" class="mono">manim-video</text></g><path class="draw" pathLength="1" d="M748 333 H776" stroke="#be123c" stroke-width="2" fill="none" style="animation-delay:1.12s"/><path class="fade" d="M780 333 l-6 -4 v8 z" fill="#be123c" style="animation-delay:1.42s"/><circle class="pulse" r="4" fill="#be123c" opacity="0"><animateMotion path="M748 333 H776" dur="1.8s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.4s" repeatCount="indefinite"/></circle></svg>