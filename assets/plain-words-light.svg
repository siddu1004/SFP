nt-size="11" font-weight="400" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:1.10s">84% on the map</text><text x="60" y="330" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.50s">SFP + bge-m3</text><rect x="184" y="314" width="190" height="20" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="184" y="314" width="119.7" height="20" rx="5" fill="#0f766e" style="animation-delay:0.78s"/><text x="384" y="329" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:1.10s">63% picked</text><rect class="grow" x="184" y="339" width="176.9" height="7" rx="3.5" fill="#0f766e" fill-opacity=".5" style="animation-delay:0.98s"/><text x="384" y="347" font-size="11" font-weight="400" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:1.20s">93% on the map</text><g class="rise" style="animation-delay:0.25s"><rect x="500" y="106" width="460" height="276" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="520" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">Real first picks</text><text x="520" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">with bge-m3, as measured, right or wrong</text></g><g class="rise" style="animation-delay:0.45s"><rect x="520" y="182" width="234" height="32" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="530" y="202" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">&quot;make the login not get hacked&quot;</text><rect x="784" y="182" width="160" height="32" rx="7" fill="#0f766e" fill-opacity="0.16" stroke="#0f766e" stroke-width="1.5"/><text x="864" y="202" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle" class="mono">web-app-penetration..</text></g><path class="draw" pathLength="1" d="M754 198 H778" stroke="#0f766e" stroke-width="2" fill="none" style="animation-delay:0.70s"/><circle class=