<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="374" viewBox="0 0 1000 374" role="img" aria-labelledby="t d"><title id="t">Blind design reviews and unseen tool verification</title><desc id="d">In blind UI design reviews, agents with SFP shipped in 2.8 rounds vs 3.7 with no skills. On an unseen tool benchmark, agents with SFP passed 7 of 7 checks vs 0 of 7 without SFP.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="374" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">Does it make the agent’s output better?</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">Blind design reviews and unseen CLI verification checks (docs/EFFECT.md).</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="450" height="246" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">1. Blind UI Design Reviews (Lower is Better)</text><text x="60" y="158" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Review rounds until a blind judge accepts the page</text></g><text x="60" y="202" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.30s">SFP picks skills</text><rect x="195" y="186" width="160" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="195" y="186" width="90.7" height="22" rx="5" fill="#2dd4bf" style="animation-delay:0.50s"/><text x="365" y="202" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.90s">2.8 rounds (5/6 shipped)</text><text x="60" y="252" font-size="13" font-weight="500" fill="#9aa4b0" text-anchor="start" class="fade" style="animation-delay:0.40s">Hand-picked skills</text><rect x="195" y="236" width="160" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="195" y="236" width="117.3" height="22" rx="5" fill="#a78bfa" style="animation-delay:0.65s"/><text x="365" y="252" font-size="12" font-weight="500" fill="#9aa4b0" text-anchor="start" class="fade" style="animation-delay:1.00s">3.7 rounds (4/6 shipped)</text><text x="60" y="302" font-size="13" font-weight="500" fill="#9aa4b0" text-anchor="start" class="fade" style="animation-delay:0.50s">No skills</text><rect x="195" y="286" width="160" height="22" rx="5" fill="#2c3643" fill-opacity=".5"/><rect class="grow" x="195" y="286" width="117.3" height="22" rx="5" fill="#fb7185" style="animation-delay:0.80s"/><text x="365" y="302" font-size="12" font-weight="500" fill="#9aa4b0" text-anchor="start" class="fade" style="animation-delay:1.10s">3.7 rounds (4/6 shipped)</text><g class="rise" style="animation-delay:0.25s"><rect x="510" y="106" width="450" height="246" rx="12" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><text x="530" y="138" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">2. Unseen Tool Benchmark (7 Checks)</text><text x="530" y="158" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Agent given a CLI/API tool not in its training weights</text></g><text x="530" y="204" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start" class="fade" style="animation-delay:0.40s">With SFP skill loaded</text><text x="860" y="204" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" class="mono fade" style="animation-delay:0.80s">7 / 7 passed</text><g class="pop" style="animation-delay:0.50s"><circle cx="548" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M542 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.58s"><circle cx="592" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M586 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.66s"><circle cx="636" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M630 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.74s"><circle cx="680" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M674 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.82s"><circle cx="724" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M718 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.90s"><circle cx="768" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M762 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pop" style="animation-delay:0.98s"><circle cx="812" cy="232" r="15" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="2"/><path d="M806 232 l4 4 l8 -8" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="530" y="284" font-size="14" font-weight="500" fill="#9aa4b0" text-anchor="start" class="fade" style="animation-delay:0.60s">Without SFP (no skill)</text><text x="860" y="284" font-size="14" font-weight="700" fill="#fb7185" text-anchor="start" class="mono fade" style="animation-delay:1.00s">0 / 7 passed</text><g class="pop" style="animation-delay:0.70s"><circle cx="548" cy="312" r="15" fill="#fb7185" fill-opacity="0.22" stroke="#fb7185" stroke-width="1.5"/><path d="M543 307 l10 10 M553 307 l-10 10" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/></g><g class="pop" style="animation-delay:0.78s"><circle cx="592" cy="312" r="15" fill="#fb7185" fill-opacity="0.22" stroke="#fb7185" stroke-width="1.5"/><path d="M587 307 l10 10 M597 307 l-10 10" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/></g><g class="pop" style="ani