<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d"><title id="t">SFP: Skills for Productivity</title><desc id="d">SFP keeps 1,065 skills on a shelf across 24 categories. For the task &quot;make the login not get hacked&quot; it lights up the few that fit and hands them to your AI: web-app-penetration-testing.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
