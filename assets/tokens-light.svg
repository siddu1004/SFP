<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="374" viewBox="0 0 1000 374" role="img" aria-labelledby="t d"><title id="t">Context window cost and selection speed</title><desc id="d">Every skill always on costs 81,691 tokens (41% of a 200k window), while SFP loads only 3,383 tokens on average (96% less), choosing in ~3-7 ms words-only or ~200 ms with local embeddings.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="374" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">Context window cost and selection speed</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">SFP cuts per-session skill overhead by 96%, leaving your 200k window free for code.</text><g class="rise" style="animation-delay:0.15s"><rect x="40" y="106" width="450" height="246" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="60" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">1. Tokens Held in Context (Lower is Better)</text><text x="60" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Measured across 91 benchmark tasks in a 200k window</text></g><text x="60" y="202" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.30s">Every skill always on</text><rect x="200" y="186" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="186" width="155.0" height="22" rx="5" fill="#be123c" style="animation-delay:0.50s"/><text x="365" y="202" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="mono fade" style="animation-delay:0.90s">81,691 tok (41% of 200k)</text><text x="60" y="252" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.40s">Only what SFP picked</text><rect x="200" y="236" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="236" width="8.0" height="22" rx="5" fill="#0f766e" style="animation-delay:0.65s"/><text x="365" y="252" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:1.00s">3,383 tok (96% less)</text><text x="60" y="302" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.50s">Router idle (sfp only)</text><rect x="200" y="286" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="200" y="286" width="8.0" height="22" rx="5" fill="#0369a1" style="animation-delay:0.80s"/><text x="365" y="302" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="mono fade" style="animation-delay:1.10s">~700 tok (0.3% of 200k)</text><g class="rise" style="animation-delay:0.25s"><rect x="510" y="106" width="450" height="246" rx="12" fill="#fbf9f4" stroke="#e2ddd2" stroke-width="1.5"/><text x="530" y="138" font-size="17" font-weight="700" fill="#1a1d21" text-anchor="start">2. Time to Pick Skills on Your Machine</text><text x="530" y="158" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">Local model judge runs only when word match is weak</text></g><text x="530" y="202" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start" class="fade" style="animation-delay:0.35s">Words + project fit</text><rect x="675" y="186" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="675" y="186" width="12.4" height="22" rx="5" fill="#0f766e" style="animation-delay:0.55s"/><text x="840" y="202" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono fade" style="animation-delay:0.95s">~3 to 7 ms (instant)</text><text x="530" y="252" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.45s">+ Meaning (bge-m3)</text><rect x="675" y="236" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="675" y="236" width="74.4" height="22" rx="5" fill="#6d28d9" style="animation-delay:0.70s"/><text x="840" y="252" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="mono fade" style="animation-delay:1.05s">~200 ms (vector cosine)</text><text x="530" y="302" font-size="13" font-weight="500" fill="#565c64" text-anchor="start" class="fade" style="animation-delay:0.55s">+ Model judge (p50)</text><rect x="675" y="286" width="155" height="22" rx="5" fill="#e2ddd2" fill-opacity=".5"/><rect class="grow" x="675" y="286" width="147.2" height="22" rx="5" fill="#b45309" style="animation-delay:0.85s"/><text x="840" y="302" font-size="12" font-weight="500" fill="#565c64" text-anchor="start" class="mono fade" style="animation-delay:1.15s">~360 ms typical</text></svg>