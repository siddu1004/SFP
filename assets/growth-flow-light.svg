ials</text><text x="318" y="168" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">deck &amp; narrative</text></g><path class="draw" pathLength="1" d="M484 155 H510" fill="none" stroke="#b45309" stroke-width="2" style="animation-delay:0.75s"/><path class="fade" d="M516 155 l-8 -4 v8 z" fill="#b45309" style="animation-delay:1.25s"/><circle class="pulse" r="4" fill="#b45309" opacity="0"><animateMotion path="M484 155 H510" dur="1.8s" begin="2.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.15s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.44s"><rect x="516" y="126" width="206" height="58" rx="12" fill="#fbf9f4" stroke="#b45309" stroke-width="2"/><circle cx="538" cy="155" r="11" fill="#b45309"/><text x="538" y="159" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="556" y="150" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono">investor-outreach</text><text x="556" y="168" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">warm &amp; cold outreach</text></g><text x="40" y="231" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" class="fade" style="animation-delay:0.35s">Write and promote bundle</text><g class="rise" style="animation-delay:0.40s"><rect x="40" y="241" width="206" height="58" rx="12" fill="#fbf9f4" stroke="#0f766e" stroke-width="2"/><circle cx="62" cy="270" r="11" fill="#0f766e"/><text x="62" y="274" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="80" y="265" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start" class="mono">article-writing</text><text x="80" y="283" font-size="12" font-weight="400" fill="#565c64" text-anchor="start">proof-led long-form</text></g><path class="draw" pathLength="1" d="M246 270 H272" fill="none" stroke="#0f766e" stroke-width="2" style="animation-delay:0.8