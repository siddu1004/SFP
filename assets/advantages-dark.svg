<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="t d"><title id="t">Why use SFP</title><desc id="d">Why use SFP: 91% less to carry (7,333 of 81,690 tokens); A map, not a guess (93.1% on the map); Fits your project (reads your manifests); Says &quot;nothing fits&quot; (84% left empty); Learns from you (stays in ~/.sfp); Runs on your machine (about 7 ms, no model).</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="444" rx="16" fill="#12171f"/><text x="40" y="50" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" class="rise">Why use SFP</text><text x="40" y="80" font-size="16" font-weight="400" fill="#9aa4b0" text-anchor="start" class="rise" style="animation-delay:0.10s">Too many skills crowd out your code. Too few, and your AI guesses. Measured with bench/release.py.</text><g class="rise" style="animation-delay:0.18s"><rect x="40.0" y="108" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M54.0 109 H321.0" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.45s"/><rect x="58.0" y="128" width="178" height="24" rx="12" fill="#2dd4bf" fill-opacity="0.22"/><text x="68.0" y="144" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="start" class="mono">7,333 of 81,690 tokens</text><text x="58.0" y="180" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">91% less to carry</text><text x="58.0" y="208" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Your AI loads the few skills this job needs,</text><text x="58.0" y="228" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">and a short map of the next 40.</text></g><g class="rise" style="animation-delay:0.28s"><rect x="352.5" y="108" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M366.5 109 H633.5" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.55s"/><rect x="370.5" y="128" width="135" height="24" rx="12" fill="#a78bfa" fill-opacity="0.22"/><text x="380.5" y="144" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="start" class="mono">93.1% on the map</text><text x="370.5" y="180" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">A map, not a guess</text><text x="370.5" y="208" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">The right skill is on the 40-skill map that often.</text><text x="370.5" y="228" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Your AI reads it and can swap one in.</text></g><g class="rise" style="animation-delay:0.38s"><rect x="665.0" y="108" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M679.0 109 H946.0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.65s"/><rect x="683.0" y="128" width="164" height="24" rx="12" fill="#38bdf8" fill-opacity="0.22"/><text x="693.0" y="144" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start" class="mono">reads your manifests</text><text x="683.0" y="180" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Fits your project</text><text x="683.0" y="208" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">package.json, Cargo.toml, go.mod and more, so a</text><text x="683.0" y="228" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Rust project gets Rust skills.</text></g><g class="rise" style="animation-delay:0.48s"><rect x="40.0" y="274" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M54.0 275 H321.0" stroke="#fb7185" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.75s"/><rect x="58.0" y="294" width="121" height="24" rx="12" fill="#fb7185" fill-opacity="0.22"/><text x="68.0" y="310" font-size="12" font-weight="700" fill="#fb7185" text-anchor="start" class="mono">84% left empty</text><text x="58.0" y="346" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Says &quot;nothing fits&quot;</text><text x="58.0" y="374" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">On tasks that need no skill, SFP stays out of the</text><text x="58.0" y="394" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">way. Keyword search: 0%.</text></g><g class="rise" style="animation-delay:0.58s"><rect x="352.5" y="274" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M366.5 275 H633.5" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.85s"/><rect x="370.5" y="294" width="128" height="24" rx="12" fill="#fbbf24" fill-opacity="0.22"/><text x="380.5" y="310" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" class="mono">stays in ~/.sfp</text><text x="370.5" y="346" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Learns from you</text><text x="370.5" y="374" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Say what helped, and the weights move on your</text><text x="370.5" y="394" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">machine. No task text is kept.</text></g><g class="rise" style="animation-delay:0.68s"><rect x="665.0" y="274" width="295" height="148" rx="14" fill="#18202b" stroke="#2c3643" stroke-width="1.5"/><path class="draw" pathLength="1" d="M679.0 275 H946.0" stroke="#a3e635" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.95s"/><rect x="683.0" y="294" width="164" height="24" rx="12" fill="#a3e635" fill-opacity="0.22"/><text x="693.0" y="310" font-size="12" font-weight="700" fill="#a3e635" text-anchor="start" class="mono">about 7 ms, no model</text><text x="683.0" y="346" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Runs on your machine</text><text x="683.0" y="374" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">Plain Python. Local models are optional, and</text><text x="683.0" y="394" font-size="12" font-weight="400" fill="#9aa4b0" text-anchor="start">nothing is sent to pick a skill.</text></g></svg>