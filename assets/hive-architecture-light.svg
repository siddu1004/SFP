<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img" aria-labelledby="t d"><title id="t">Inside the engine</title><desc id="d">Inside the engine: 1. Readers: Words, Full text, Requests, Meaning; 2. Situation: Project, Phase, Before, Wrong tech; 3. The city: Heights, Neighbours, Selector, Towers; 4. Guards: Nothing fits, Quorum, Budget, Pins; 5. Learning: Feedback, Taste, LinUCB, Research.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="462" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">Inside the engine</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">One select_skills call, left to right. Only Meaning needs a model; without it the rest still runs.</text><g class="rise" style="animation-delay:0.18s"><rect x="40" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#0369a1" stroke-width="1.5"/><path class="draw" pathLength="1" d="M52 109 H200" stroke="#0369a1" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.45s"/><text x="54" y="138" font-size="15" font-weight="700" fill="#0369a1" text-anchor="start">1. Readers</text><rect x="50" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="58" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Words</text><text x="58" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">name, tags, description</text><rect x="50" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="58" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Full text</text><text x="58" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">BM25 over SKILL.md</text><rect x="50" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="58" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Requests</text><text x="58" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">10 examples per skill</text><rect x="50" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="58" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Meaning</text><text x="58" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">bge-m3, four views</text></g><path class="draw" pathLength="1" d="M212 253.0 H222" stroke="#0369a1" stroke-width="2" fill="none" style="animation-delay:0.70s"/><path class="fade" d="M227 253.0 l-7 -4 v8 z" fill="#0369a1" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#0369a1" opacity="0"><animateMotion path="M212 253.0 H222" dur="1.8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.30s"><rect x="227" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#b45309" stroke-width="1.5"/><path class="draw" pathLength="1" d="M239 109 H387" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.57s"/><text x="241" y="138" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">2. Situation</text><rect x="237" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="245" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Project</text><text x="245" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">manifests and files</text><rect x="237" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="245" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Phase</text><text x="245" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">Kalman filter on work</text><rect x="237" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="245" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Before</text><text x="245" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">Markov over sequences</text><rect x="237" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="245" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Wrong tech</text><text x="245" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">dropped</text></g><path class="draw" pathLength="1" d="M399 253.0 H409" stroke="#b45309" stroke-width="2" fill="none" style="animation-delay:0.82s"/><path class="fade" d="M414 253.0 l-7 -4 v8 z" fill="#b45309" style="animation-delay:1.12s"/><circle class="pulse" r="4" fill="#b45309" opacity="0"><animateMotion path="M399 253.0 H409" dur="1.8s" begin="1.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.75s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.42s"><rect x="414" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#0f766e" stroke-width="1.5"/><path class="draw" pathLength="1" d="M426 109 H574" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.69s"/><text x="428" y="138" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">3. The city</text><rect x="424" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="432" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Heights</text><text x="432" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">rank on every map</text><rect x="424" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="432" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Neighbours</text><text x="432" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">lend each other height</text><rect x="424" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="432" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Selector</text><text x="432" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">softmax over the maps</text><rect x="424" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="432" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Towers</text><text x="432" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">the next 40, grouped</text></g><path class="draw" pathLength="1" d="M586 253.0 H596" stroke="#0f766e" stroke-width="2" fill="none" style="animation-delay:0.94s"/><path class="fade" d="M601 253.0 l-7 -4 v8 z" fill="#0f766e" style="animation-delay:1.24s"/><circle class="pulse" r="4" fill="#0f766e" opacity="0"><animateMotion path="M586 253.0 H596" dur="1.8s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.0s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.54s"><rect x="601" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#be123c" stroke-width="1.5"/><path class="draw" pathLength="1" d="M613 109 H761" stroke="#be123c" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.81s"/><text x="615" y="138" font-size="15" font-weight="700" fill="#be123c" text-anchor="start">4. Guards</text><rect x="611" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="619" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Nothing fits</text><text x="619" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">says so, and why</text><rect x="611" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="619" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Quorum</text><text x="619" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">in a project, signals agree</text><rect x="611" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="619" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Budget</text><text x="619" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">tokens are capped</text><rect x="611" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="619" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Pins</text><text x="619" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">your choices always win</text></g><path class="draw" pathLength="1" d="M773 253.0 H783" stroke="#be123c" stroke-width="2" fill="none" style="animation-delay:1.06s"/><path class="fade" d="M788 253.0 l-7 -4 v8 z" fill="#be123c" style="animation-delay:1.36s"/><circle class="pulse" r="4" fill="#be123c" opacity="0"><animateMotion path="M773 253.0 H783" dur="1.8s" begin="2.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.25s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.66s"><rect x="788" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#6d28d9" stroke-width="1.5"/><path class="draw" pathLength="1" d="M800 109 H948" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.93s"/><text x="802" y="138" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">5. Learning</text><rect x="798" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="806" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Feedback</text><text x="806" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">moves map weights</text><rect x="798" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="806" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Taste</text><text x="806" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">30-day half-life</text><rect x="798" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="806" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">LinUCB</text><text x="806" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">words to skills</text><rect x="798" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2"/><text x="806" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Research</text><text x="806" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">drafts you approve</text></g><path class="draw" pathLength="1" d="M874 400 V434 H500 V406" fill="none" stroke="#0f766e" stroke-width="2" style="animation-delay:1.80s"/><path class="fade" d="M500 400 l-5 8 h10 z" fill="#0f766e" style="animation-delay:2.40s"/><text x="486" y="438" font-size="13" font-weight="600" fill="#0f766e" text-anchor="end" class="fade" style="animation-delay:2.20s">feedback moves the weights in ~/.sfp; no task text is stored</text></svg>