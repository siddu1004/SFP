<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img" aria-labelledby="t d"><title id="t">Inside the five-layer Hive engine</title><desc id="d">Inside the five-layer Hive engine: 1. Scouts and Manifest Fit, 2. Semantic Meaning (bge-m3), 3. Local Model Judge, 4. Skill Card Quorum and Dedup, 5. LinUCB Taste and Ordered Bundles.</desc><style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s cubic-bezier(.23,1,.32,1) both}
.rise{animation:rise .7s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.23,1,.32,1) both}
.glow{animation:glow 2.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.cover{display:none}}
</style><rect width="1000" height="462" rx="16" fill="#f4f1ea"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="start" class="rise">Inside the five-layer Hive engine</text><text x="40" y="80" font-size="16" font-weight="400" fill="#565c64" text-anchor="start" class="rise" style="animation-delay:0.10s">One select_skills call. Local models are optional; without them the deterministic layers still run.</text><g class="rise" style="animation-delay:0.18s"><rect x="40" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#0369a1" stroke-width="1.5"/><path class="draw" pathLength="1" d="M52 109 H200" stroke="#0369a1" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.45s"/><text x="54" y="138" font-size="15" font-weight="700" fill="#0369a1" text-anchor="start">1. Scouts &amp; Fit</text><rect x="50" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="58" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Task Stems</text><text x="58" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">tokenized prompt words</text><rect x="50" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="58" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Manifests</text><text x="58" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">Cargo.toml, package.json</text><rect x="50" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="58" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Work Phase</text><text x="58" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">Kalman filter on edits</text><rect x="50" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="58" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Tech Gate</text><text x="58" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">drops mismatched stacks</text></g><path class="draw" pathLength="1" d="M212 253.0 H222" stroke="#0369a1" stroke-width="2" fill="none" style="animation-delay:0.70s"/><path class="fade" d="M227 253.0 l-7 -4 v8 z" fill="#0369a1" style="animation-delay:1.00s"/><circle class="pulse" r="4" fill="#0369a1" opacity="0"><animateMotion path="M212 253.0 H222" dur="1.8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.30s"><rect x="227" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#6d28d9" stroke-width="1.5"/><path class="draw" pathLength="1" d="M239 109 H387" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.57s"/><text x="241" y="138" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">2. Meaning</text><rect x="237" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="245" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">bge-m3 Vectors</text><text x="245" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">local embedding cosine</text><rect x="237" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="245" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Skill Cards</text><text x="245" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">descriptions &amp; triggers</text><rect x="237" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="245" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Example Bank</text><text x="245" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">paraphrased queries</text><rect x="237" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="245" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Adaptive Lead</text><text x="245" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">leads if words &lt; 50%</text></g><path class="draw" pathLength="1" d="M399 253.0 H409" stroke="#6d28d9" stroke-width="2" fill="none" style="animation-delay:0.82s"/><path class="fade" d="M414 253.0 l-7 -4 v8 z" fill="#6d28d9" style="animation-delay:1.12s"/><circle class="pulse" r="4" fill="#6d28d9" opacity="0"><animateMotion path="M399 253.0 H409" dur="1.8s" begin="1.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="1.75s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.42s"><rect x="414" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#b45309" stroke-width="1.5"/><path class="draw" pathLength="1" d="M426 109 H574" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.69s"/><text x="428" y="138" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">3. Local Judge</text><rect x="424" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="432" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Auto Gate</text><text x="432" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">fires only on weak words</text><rect x="424" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="432" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Top-20 Slate</text><text x="432" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">reads closest candidates</text><rect x="424" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="432" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Selects 1 to 3</text><text x="432" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">orders by direct utility</text><rect x="424" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="432" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Safe Guard</text><text x="432" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">never overrides tech fit</text></g><path class="draw" pathLength="1" d="M586 253.0 H596" stroke="#b45309" stroke-width="2" fill="none" style="animation-delay:0.94s"/><path class="fade" d="M601 253.0 l-7 -4 v8 z" fill="#b45309" style="animation-delay:1.24s"/><circle class="pulse" r="4" fill="#b45309" opacity="0"><animateMotion path="M586 253.0 H596" dur="1.8s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.0s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.54s"><rect x="601" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#be123c" stroke-width="1.5"/><path class="draw" pathLength="1" d="M613 109 H761" stroke="#be123c" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.81s"/><text x="615" y="138" font-size="15" font-weight="700" fill="#be123c" text-anchor="start">4. Card Quorum</text><rect x="611" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="619" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Quorum Rule</text><text x="619" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">requires multi-signal vote</text><rect x="611" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="619" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Substitutes</text><text x="619" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">deduplicates twin skills</text><rect x="611" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="619" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Role Slots</text><text x="619" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">base, check, finish, style</text><rect x="611" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="619" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Confidence</text><text x="619" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">0.0% junk on edge tasks</text></g><path class="draw" pathLength="1" d="M773 253.0 H783" stroke="#be123c" stroke-width="2" fill="none" style="animation-delay:1.06s"/><path class="fade" d="M788 253.0 l-7 -4 v8 z" fill="#be123c" style="animation-delay:1.36s"/><circle class="pulse" r="4" fill="#be123c" opacity="0"><animateMotion path="M773 253.0 H783" dur="1.8s" begin="2.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" begin="2.25s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:0.66s"><rect x="788" y="108" width="172" height="290" rx="12" fill="#fbf9f4" stroke="#0f766e" stroke-width="1.5"/><path class="draw" pathLength="1" d="M800 109 H948" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:0.93s"/><text x="802" y="138" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">5. Taste &amp; Out</text><rect x="798" y="160" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="806" y="179" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">30d Half-Life</text><text x="806" y="196" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">animation, text, code</text><rect x="798" y="216" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="806" y="235" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">LinUCB Model</text><text x="806" y="252" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">word-to-skill weights</text><rect x="798" y="272" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="806" y="291" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">121 Bundles</text><text x="806" y="308" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">100% skills bundled</text><rect x="798" y="328" width="152" height="46" rx="7" fill="#f4f1ea" stroke="#e2ddd2" stroke-width="1"/><text x="806" y="347" font-size="13" font-weight="700" fill="#1a1d21" text-anchor="start">Markov Next</text><text x="806" y="364" font-size="11" font-weight="400" fill="#565c64" text-anchor="start">predicts next phase skill</text></g><path class="draw" pathLength="1" d="M874 400 V434 H126 V406" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="1" style="animation-delay:1.80s"/><path class="fade" d="M126 400 l-5 8 h10 z" fill="#0f766e" style="animation-delay:2.40s"/><rect x="210" y="421" width="580" height="24" rx="6" fill="#f4f1ea"/><text x="500" y="438" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle" class="fade" style="animation-delay:2.20s">Feedback, test runs &amp; commits update LinUCB &amp; taste in ~/.sfp (zero task text stored)</text></svg>