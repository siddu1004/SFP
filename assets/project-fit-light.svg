lass="fade" d="M550 338 l-8 -4 v8 z" fill="#0369a1" style="animation-delay:1.58s"/><circle class="pulse" r="4" fill="#0369a1" opacity="0"><animateMotion path="M456 228 C500 228 500 338 544 338" dur="2.0s" begin="2.62s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.0s" begin="2.62s" repeatCount="indefinite"/></circle><g class="rise" style="animation-delay:1.23s"><rect x="552" y="317" width="408" height="42" rx="10" fill="#fbf9f4" stroke="#0369a1" stroke-width="1.5"/><rect x="562" y="325" width="74" height="26" rx="6" fill="#0369a1" fill-opacity="0.16"/><text x="599" y="342" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="middle">Django</text><text x="648" y="342" font-size="12" font-weight="500" fill="#1a1d21" text-anchor="start" class="mono">django-celery, django-tdd</text></g></svg>