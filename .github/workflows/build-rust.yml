name: Rust Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sfp-linux-amd64
            binary_path: target/x86_64-unknown-linux-gnu/release/sfp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sfp-windows-amd64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/sfp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sfp-darwin-arm64
            binary_path: target/aarch64-apple-darwin/release/sfp
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sfp-darwin-amd64
            binary_path: target/x86_64-apple-darwin/release/sfp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
