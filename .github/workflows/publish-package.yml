name: Publish to npm

# A release tag (v3.18.0) publishes that version as `sfp-hive` on the public npm registry. The launcher in the package
# clones the same tag on first run, so the tag is what users run. Needs the repository secret NPM_TOKEN (an npm
# automation token); provenance links the package to this workflow and commit so anyone can check where it came from.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - name: Publish sfp-hive
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN secret is not set; skipping publish."; exit 0; fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view sfp-hive@$CURRENT_VERSION version > /dev/null 2>&1; then
            echo "sfp-hive@$CURRENT_VERSION is already on npm. Skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
