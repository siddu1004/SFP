name: Publish to GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@siddu1004'

      - name: Publish to GitHub Packages
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @siddu1004/sfp@$CURRENT_VERSION version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published to GitHub Packages. Skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
